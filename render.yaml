# إعداد النشر على Render (خدمة واحدة: الباكند يقدّم الواجهة)
# بعد ربط المستودع، يقرأ Render هذا الملف تلقائياً.
services:
  - type: web
    name: mijhar
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      # مفتاح Google Gemini — مجاني بدون بطاقة (aistudio.google.com)
      # يُضاف يدوياً من لوحة تحكم Render (سرّي، لا يوضع في الكود)
      - key: GEMINI_API_KEY
        sync: false
      # (اختياري) مفتاح Claude — إن وُجد فله الأولوية على Gemini
      - key: ANTHROPIC_API_KEY
        sync: false
