# إعداد النشر على Render (خدمة واحدة: الباكند يقدّم الواجهة)
# بعد ربط المستودع، يقرأ Render هذا الملف تلقائياً.
services:
  - type: web
    name: mijhar
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      # مفاتيح الذكاء الاصطناعي المجانية — يُضاف واحد منها من لوحة Render (سرّي)
      # Google Gemini — مجاني (aistudio.google.com)
      - key: GEMINI_API_KEY
        sync: false
      # Groq — مجاني بدون بطاقة وحصته أكرم (console.groq.com)
      - key: GROQ_API_KEY
        sync: false
      # (اختياري) Claude — إن وُجد فله الأولوية (يحتاج رصيد مدفوع)
      - key: ANTHROPIC_API_KEY
        sync: false
